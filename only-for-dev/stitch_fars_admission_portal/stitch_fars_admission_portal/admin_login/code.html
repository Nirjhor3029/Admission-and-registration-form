<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FARS - Admin Login</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary": "#003b35",
                        "on-tertiary-fixed-variant": "#005049",
                        "outline": "#727780",
                        "on-background": "#0b1c30",
                        "surface-tint": "#2d6197",
                        "on-primary": "#ffffff",
                        "surface-variant": "#d3e4fe",
                        "background": "#f8f9ff",
                        "surface-container-low": "#eff4ff",
                        "on-secondary": "#ffffff",
                        "surface-dim": "#cbdbf5",
                        "outline-variant": "#c2c7d1",
                        "secondary": "#855300",
                        "surface-container-lowest": "#ffffff",
                        "on-surface": "#0b1c30",
                        "on-primary-container": "#8ebdf9",
                        "primary-fixed-dim": "#a0c9ff",
                        "on-primary-fixed": "#001c37",
                        "secondary-fixed": "#ffddb8",
                        "surface-container-high": "#dce9ff",
                        "primary-fixed": "#d2e4ff",
                        "on-secondary-container": "#684000",
                        "on-tertiary-container": "#5eccbe",
                        "primary": "#00355f",
                        "on-error": "#ffffff",
                        "on-primary-fixed-variant": "#07497d",
                        "tertiary-fixed-dim": "#6bd8cb",
                        "error-container": "#ffdad6",
                        "tertiary-container": "#00544d",
                        "error": "#ba1a1a",
                        "inverse-primary": "#a0c9ff",
                        "surface-bright": "#f8f9ff",
                        "on-secondary-fixed-variant": "#653e00",
                        "on-tertiary": "#ffffff",
                        "inverse-on-surface": "#eaf1ff",
                        "secondary-fixed-dim": "#ffb95f",
                        "on-surface-variant": "#42474f",
                        "on-tertiary-fixed": "#00201d",
                        "surface": "#f8f9ff",
                        "tertiary-fixed": "#89f5e7",
                        "inverse-surface": "#213145",
                        "on-error-container": "#93000a",
                        "surface-container-highest": "#d3e4fe",
                        "primary-container": "#0f4c81",
                        "surface-container": "#e5eeff",
                        "secondary-container": "#fea619",
                        "on-secondary-fixed": "#2a1700"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-lg": "2rem",
                        "stack-sm": "0.5rem",
                        "gutter": "1.5rem",
                        "margin-mobile": "1rem",
                        "margin-desktop": "2.5rem",
                        "stack-md": "1rem",
                        "container-max": "1280px"
                    },
                    "fontFamily": {
                        "body-sm": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-xl": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],

                        "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600" }],

                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "headline-xl": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Custom styles for input autofill to maintain design system colors */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #ffffff inset !important;
            -webkit-text-fill-color: #0b1c30 !important;
        }
    </style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop antialiased relative overflow-hidden">
<!-- Subtle background decoration to elevate the "clean" feel -->
<div class="absolute inset-0 z-0 pointer-events-none flex items-center justify-center opacity-40">
<div class="w-[800px] h-[800px] bg-primary/5 rounded-full blur-3xl absolute top-[-20%] left-[-10%]"></div>
<div class="w-[600px] h-[600px] bg-surface-variant/20 rounded-full blur-3xl absolute bottom-[-10%] right-[-10%]"></div>
</div>
<!-- Login Card Container -->
<main class="w-full max-w-md z-10">
<!-- The Card -->
<div class="bg-surface border border-outline-variant/50 rounded-xl shadow-[0_10px_25px_-5px_rgba(0,53,95,0.05)] p-8 flex flex-col gap-stack-lg backdrop-blur-sm">
<!-- Branding Header -->
<header class="flex flex-col items-center justify-center text-center gap-2">
<div class="w-16 h-16 bg-surface-container-low rounded-full flex items-center justify-center mb-2 border border-outline-variant/30">
<span class="material-symbols-outlined text-[32px] text-primary" style="font-variation-settings: 'FILL' 1;">school</span>
</div>
<h1 class="font-headline-xl text-headline-xl text-primary tracking-tight">FARS</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Administrator Portal</p>
</header>
<!-- Login Form -->
<form class="flex flex-col gap-stack-md" onsubmit="event.preventDefault();">
<!-- Email Input Group -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant pointer-events-none">mail</span>
<input class="w-full h-12 pl-12 pr-4 rounded-lg border border-outline-variant bg-surface text-on-surface font-body-md text-body-md placeholder-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200" id="email" placeholder="admin@institution.edu" required="" type="email"/>
</div>
</div>
<!-- Password Input Group -->
<div class="flex flex-col gap-stack-sm">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant pointer-events-none">lock</span>
<input class="w-full h-12 pl-12 pr-12 rounded-lg border border-outline-variant bg-surface text-on-surface font-body-md text-body-md placeholder-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200" id="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-4 text-on-surface-variant hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex items-center justify-between mt-1">
<label class="flex items-center gap-2 cursor-pointer group">
<div class="relative flex items-center justify-center w-4 h-4">
<input class="peer appearance-none w-4 h-4 border border-outline-variant rounded bg-surface checked:bg-primary checked:border-primary transition-colors cursor-pointer" type="checkbox"/>
<span class="material-symbols-outlined absolute text-[12px] text-on-primary opacity-0 peer-checked:opacity-100 pointer-events-none transition-opacity" style="font-variation-settings: 'FILL' 1, 'wght' 700;">check</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Remember me</span>
</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<!-- Submit Action -->
<button class="w-full h-12 mt-4 bg-primary text-on-primary rounded-lg font-label-md text-label-md hover:bg-primary-container active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2 shadow-sm" type="submit">
                    Sign In to Console
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
</div>
<!-- Secure Connection Indicator -->
<div class="mt-6 flex items-center justify-center gap-2 text-on-surface-variant/80">
<span class="material-symbols-outlined text-[16px]">verified_user</span>
<span class="font-body-sm text-body-sm">Secure 256-bit Encrypted Connection</span>
</div>
</main>
</body></html>
